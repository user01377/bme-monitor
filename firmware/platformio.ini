[env:telemetry]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BME280 Library
    bblanchon/ArduinoJson@^7.4.3

[env:provisioning]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DPROVISIONING