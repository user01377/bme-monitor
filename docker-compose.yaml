services:
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}

  db:
      image: postgres:16
      restart: always
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB}"]
        interval: 2s
        timeout: 5s
        retries: 5
        start_period: 3s

  db-migration:
    build: 
      context: ./database
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    env_file:
      - .env

  data-receiver-migration:
    build:
      context: ./services/data-receiver
      dockerfile: Dockerfile
    volumes:
      - receiver_data:/data
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/devices.db

  data-receiver:
    build:
      context: ./services/data-receiver
      dockerfile: Dockerfile
    volumes:
      - receiver_data:/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/devices.db
    
    depends_on:
      data-receiver-migration:
        condition: service_completed_successfully
  
  database-handler-in:
    build:
      context: ./services/database-handler-in
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - .env

    depends_on:
      db-migration:
        condition: service_completed_successfully
  
  database-handler-out:
    build:
      context: ./services/database-handler-out
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env

    depends_on:
      db-migration:
        condition: service_completed_successfully

  data-server-migration:
    build:
      context: ./services/data-server
      dockerfile: Dockerfile
    volumes:
      - server_data:/data
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/data-server.db
  
  data-server:
    build:
      context: ./services/data-server
      dockerfile: Dockerfile
    volumes:
      - server_data:/data
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/data-server.db

    depends_on:
      data-server-migration:
        condition: service_completed_successfully

        
volumes:
  postgres_data:
  receiver_data:
  server_data: