services:
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}

  db:
      image: postgres:16
      restart: always
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"

  data-receiver:
    build:
      context: ./services/data-receiver
      dockerfile: Dockerfile
    volumes:
      - receiver_data:/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/devices.db
  
  database-handler-in:
    build:
      context: ./services/database-handler-in
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - .env
  
  database-handler-out:
    build:
      context: ./services/database-handler-out
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env

        
volumes:
  postgres_data:
  receiver_data: