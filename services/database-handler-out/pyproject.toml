[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bme-handler-out"
version = "0.1.0"
description = "The microservice which fetches telemetry data from the database"

requires-python = ">=3.12"
dependencies=[
    "fastapi[standard]",
    "sqlalchemy",
    "pydantic",
    "psycopg[binary]"
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx2"
]